name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  image-formats:
    name: RAW, E01, and VMDK end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs ewf-tools qemu-utils
      - name: Build native CLI
        run: cargo build
      - name: Create filesystem and container fixtures
        run: |
          truncate -s 32M /tmp/fimg.raw
          mkfs.ext4 -q /tmp/fimg.raw
          debugfs -w -R "mkdir /docs" /tmp/fimg.raw
          debugfs -w -R "write README.md /docs/README.md" /tmp/fimg.raw
          qemu-img convert -f raw -O vmdk -o subformat=monolithicSparse \
            /tmp/fimg.raw /tmp/fimg.vmdk
          ewfacquire -u -q -c fast -t /tmp/fimg /tmp/fimg.raw
      - name: Browse and extract every format
        run: |
          set -euo pipefail
          for image in /tmp/fimg.raw /tmp/fimg.vmdk /tmp/fimg.E01; do
            target/debug/fimg tree "$image" --max-depth 3 | grep "README.md"
            target/debug/fimg find "$image" '(?i)readme[.]md' | grep "/docs/README.md"
            target/debug/fimg extract "$image" /docs/README.md \
              --output /tmp/extracted.md --overwrite
            cmp /tmp/extracted.md README.md
          done

